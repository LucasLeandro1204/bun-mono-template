name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production readiness checks
        run: bun run check

      - name: Smoke production entrypoint
        run: timeout 10s bun run start

      - name: Dry-run workspace packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          package_dirs=(packages/*)
          if (( ${#package_dirs[@]} == 0 )); then
            echo "No workspace packages found."
            exit 0
          fi

          for package_dir in "${package_dirs[@]}"; do
            if [[ -f "$package_dir/package.json" ]]; then
              echo "::group::${package_dir}"
              bun --cwd="$package_dir" pm pack --dry-run --ignore-scripts
              echo "::endgroup::"
            fi
          done

      - name: Check changeset release status
        run: bun run changeset:status
